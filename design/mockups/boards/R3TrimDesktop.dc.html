<!doctype html>

<x-dc>
<helmet>

<style>
body{margin:0}

.cond{font-family:'Big Shoulders Display',sans-serif;text-transform:uppercase}
.scallop{background:radial-gradient(circle at 9px 0,#F2643D 0 6px,#14110F 6px 8px,transparent 8.5px) 0 0/18px 10px repeat-x}

.cast:hover{transform:translateY(-2px)}
.cast:focus-visible{outline:4px solid #0A5F5C;outline-offset:4px}
</style>
</helmet>

    <div class="cond" style="margin-top:12px;border-top:2px solid #FFC93C;padding-top:10px;font-size:26px;font-weight:900;letter-spacing:.06em;color:#F2643D">Cast 2 of 3</div>
  </div>
  <div style="position:absolute;left:28px;top:222px;width:1224px;border-top:6px solid #14110F"></div>
  <div class="scallop" style="position:absolute;left:28px;top:230px;width:1224px;height:10px"></div>

    <figcaption style="display:flex;justify-content:space-between;font-size:14px;font-weight:700;margin-top:6px"><span>Where does it live?</span><a href="#credit" style="font-weight:500">Photo credit (spoiler)</a></figcaption>
  </figure>
  <section aria-label="Clues" style="position:absolute;left:28px;top:680px;width:572px;border-top:3px solid #14110F;padding-top:8px">

      <li style="display:flex;gap:12px;font-weight:800"><span style="font-family:Chango,sans-serif;font-size:15px;width:18px;color:#9A2B12">2</span>Salt water, 5 to 10 metres down.</li>
      <li style="display:flex;gap:12px;color:#5C4A12"><span style="font-family:Chango,sans-serif;font-size:15px;width:18px">3</span>Unlocks if cast 2 misses.</li>
    </ol>
  </section>

  <section style="position:absolute;left:636px;top:256px;width:616px">
    <div class="cond" style="background:#14110F;color:#FFC93C;padding:4px 10px;font-size:22px;font-weight:900;letter-spacing:.08em">Chart of the day</div>
    <div style="position:relative;width:616px;height:320px;border:3px solid #14110F;border-top:0;box-sizing:border-box">
      <img src="/_blob/5ecc4f5ed4bfe6eddddb41f5a947f3df" alt="World chart: coral halftone land, ruled lines of latitude and longitude" style="position:absolute;left:0;top:4px;width:610px;height:317px">

      <div style="position:absolute;left:505px;top:216px;width:34px;height:34px;border-radius:50%;border:4px solid #14110F;box-sizing:border-box;background:rgba(242,100,61,.55)" aria-label="Pin 2, near Melbourne"></div>
      <div style="position:absolute;left:521px;top:192px;width:2px;height:82px;background:#14110F"></div>
      <div style="position:absolute;left:482px;top:232px;width:80px;height:2px;background:#14110F"></div>
    </div>
  </section>

  <section style="position:absolute;left:636px;top:612px;width:296px">
    <div class="cond" style="font-size:22px;font-weight:900;letter-spacing:.06em;border-bottom:3px solid #14110F;line-height:1.15">Tide table</div>

      <tbody>
        <tr style="border-bottom:2px solid #14110F"><td style="font-family:Chango,sans-serif;font-size:18px;padding:5px 0;width:30px">1</td><td class="cond" style="font-size:32px;font-weight:900;line-height:1">2,043 km</td><td class="cond" style="font-size:20px;font-weight:900;text-align:right">West</td></tr>
        <tr style="border-bottom:2px solid #14110F;background:#F2643D"><td style="font-family:Chango,sans-serif;font-size:18px;padding:5px 0 5px 4px">2</td><td class="cond" style="font-size:18px;font-weight:700" colspan="2">Pin set, ready to cast</td></tr>
        <tr style="border-bottom:3px solid #14110F"><td style="font-family:Chango,sans-serif;font-size:18px;padding:5px 0">3</td><td class="cond" style="font-size:18px;font-weight:500;color:#5C4A12" colspan="2">Last cast</td></tr>
      </tbody>
    </table>
  </section>

  <button class="cast" type="button" style="position:absolute;left:956px;top:612px;width:296px;height:150px;background:#FFF6DF;border:4px dashed #14110F;border-radius:6px;font-family:Grandstander,sans-serif;color:#14110F;padding:14px 18px;text-align:left;box-sizing:border-box">
    <span style="display:block;font-family:Chango,sans-serif;font-size:37px;line-height:1;color:#9A2B12;white-space:nowrap">Cast No.2</span>
    <span class="cond" style="display:block;font-size:17px;font-weight:700;letter-spacing:.06em;margin-top:12px">Pin at 37.8&#176;S 145.0&#176;E</span>

</div>
