# Render Blueprint: a static site rebuilt from the repo on every push to main.
services:
  - type: web
    runtime: static
    name: glub
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # The build command installs from the lockfile itself, so skip Render's own install step.
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: NODE_VERSION
        value: "24"
    headers:
      # Fish data and the schedule change with each deploy; check for a fresh copy every load.
      - path: /data/*
        name: Cache-Control
        value: no-cache
      # Vite fingerprints everything under /assets.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
